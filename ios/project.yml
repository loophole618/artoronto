# XcodeGen spec. CI runs `xcodegen generate` to make Artoronto.xcodeproj,
# so the Xcode project file never lives in git.
name: Artoronto
options:
  bundleIdPrefix: com.loophole618
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HelloAR:
    type: application
    platform: iOS
    sources: [HelloAR]
    scheme: {}
    info:
      path: HelloAR/Info.plist
      properties:
        CFBundleDisplayName: ARToronto
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit]
        NSCameraUsageDescription: "ARToronto uses the camera to place the sphere in the space around you."
        NSLocationWhenInUseUsageDescription: "ARToronto uses your location to place site overlays on the real street."
        NSLocalNetworkUsageDescription: "ARToronto sends what it sees to the studio computer on your Wi-Fi when you press LOOK."
        NSBonjourServices: ["_skyelook._tcp"]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ARTBuildLabel: "$(ART_BUILD_LABEL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loophole618.artoronto.hello
        TARGETED_DEVICE_FAMILY: "1"
        ART_BUILD_LABEL: local
